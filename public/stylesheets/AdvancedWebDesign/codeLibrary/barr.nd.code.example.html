<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body class="nd-container">

<h2>Displaying Examples</h2>
<p>The w3-panel class can be used to display examples:</p>

<div class="nd-panel nd-card nd-light-grey">
  <h3>Example</h3>
  <div class="nd-container nd-white">
    <p>
    <ul class="nd-ul nd-card-4" style="width:50%">
      <li>Jill</li>
      <li>Eve</li>
      <li>Adam</li>
    </ul>
    </p>
  </div>
  <p>A list displayed as a card.</p>
</div>

</body>
</html>
