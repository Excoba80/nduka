<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css ">
<body class="nd-container">

<h2>Display Alerts</h2>
<p>The w3-panel class can be used to display alerts:</p>

<div class="nd-panel nd-pale-red nd-border">
  <h3>Danger!</h3>
  <p>Red often indicates a dangerous or negative situation.</p>
</div>

<p>Alerts are often displayed using a strong color:</p>

<div class="nd-panel nd-red">
  <h3>Danger!</h3>
  <p>Red often indicates a dangerous or negative situation.</p>
</div>

</body>
</html>
