<!DOCTYPE html>
<html>
<title>Card Hover</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Shadow on Hover</h2>
  <p>The w3-hover-shadow class adds a shadow effect on hover - this will make any element look like a "w3-card-4".</p>

  <div class="nd-green nd-hover-shadow nd-padding-64 nd-center" style="width:70%">
    <p>Hover over me to display me as a card!</p>
  </div>
</div>

</body>
</html>
