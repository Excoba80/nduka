<!DOCTYPE html>
<html>
<title>Card circle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Card Example</h2>

  <div class="nd-card-4" style="width:70%">
    <header class="nd-container nd-light-grey">
      <h3>John Doe</h3>
    </header>
    <div class="nd-container">
      <p>1 new friend request</p>
      <hr>
      <img src="/AdvancedWebDesign/w3-images/img_avatar3.png" alt="Avatar" class="nd-left nd-circle nd-margin-right" style="width:60px">
      <p>CEO at Mighty Schools. Marketing and Advertising. Seeking a new job and new opportunities.</p><br>
    </div>
    <button class="nd-button nd-block nd-dark-grey">+ Connect</button>
  </div>
</div>

</body>
</html>
