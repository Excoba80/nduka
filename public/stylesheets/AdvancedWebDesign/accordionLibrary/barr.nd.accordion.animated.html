<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css     ">
<body>
<div class="nd-container">

<h2>Animated Accordions</h2>
<p>Use any of the w3-animate-classes to fade, zoom or slide in the accordion content (w3-animate-zoom|opacity|top|bottom|left|right):</p>

<button onclick="myFunction('Demo1')" class="nd-button nd-block nd-black nd-left-align">Accordion</button>
<div id="Demo1" class="nd-hide nd-animate-zoom">
  <a href="#" class="nd-button nd-block nd-left-align">Link 1</a>
  <a href="#" class="nd-button nd-block nd-left-align">Link 2</a>
  <a href="#" class="nd-button nd-block nd-left-align">Link 3</a>
  </div>
</div>

<script>
function myFunction(id) {
  var x = document.getElementById(id);
  if (x.className.indexOf("nd-show") == -1) {
    x.className += " nd-show";
  } else { 
    x.className = x.className.replace(" nd-show", "");
  }
}
</script>

</body>
</html>
