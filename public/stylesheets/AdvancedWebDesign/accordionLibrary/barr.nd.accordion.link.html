<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css    ">
<body>

<div class="nd-container">
<h2>Accordions</h2>
<p>An accordion with links:</p>

<button onclick="myFunction('Demo1')" class="nd-button nd-block nd-black nd-left-align">
Accordion 1</button>

<div id="Demo1" class="nd-hide">
  <a class="nd-button nd-block nd-left-align" href="#">Link 1</a>
  <a class="nd-button nd-block nd-left-align" href="#">Link 2</a>
  <a class="nd-button nd-block nd-left-align" href="#">Link 3</a>
</div>

</div>
<script>
function myFunction(id) {
  var x = document.getElementById(id);
  if (x.className.indexOf("nd-show") == -1) {
    x.className += " nd-show";
  } else { 
    x.className = x.className.replace(" nd-show", "");
  }
}
</script>

</body>
</html>
