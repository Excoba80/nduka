<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css    ">
<body>
<div class="nd-container">

<h2>Accordion Width</h2>
<p>By default, the width of block is 100%. To override this, change the CSS width property of the accordion container <br> <br>




Use the CSS width property to change the width of the accordion:</p>

<div class="nd-grey nd-section" style="width:25%">
  <button onclick="myFunction('Demo1')" class="nd-button nd-block">
  25%</button>
  <div id="Demo1" class="nd-hide nd-container">
    <p>Lorem ipsum 25% width</p>
  </div>
</div>

<div class="nd-dark-grey nd-section" style="width:50%">
  <button onclick="myFunction('Demo2')" class="nd-button nd-block">
  50%</button>
  <div id="Demo2" class="nd-hide nd-container">
    <p>Lorem ipsum 50% width</p>
  </div>
</div>

<div class="nd-light-grey nd-section" style="width:75%">
  <button onclick="myFunction('Demo3')" class="nd-button nd-block">
  75%</button>
  <div id="Demo3" class="nd-hide nd-container">
    <p>Lorem ipsum 75% width</p>
  </div>
</div>

<div class="nd-light-grey nd-section">
  <button onclick="myFunction('Demo4')" class="nd-button nd-block">
  Default (100%)</button>
  <div id="Demo4" class="nd-hide nd-container">
    <p>Lorem ipsum 100% width</p>
  </div>
</div>

</div>
<script>
function myFunction(id) {
  var x = document.getElementById(id);
  if (x.className.indexOf("nd-show") == -1) {
    x.className += " nd-show";
  } else { 
    x.className = x.className.replace(" nd-show", "");
  }
}
</script>

</body>
</html>
