<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css    ">
<body>
<div class="nd-container">

<h2>Accordions</h2>
<p>  Use the w3-hide class to hide the accordion content.<br> <br>

Use any kind of button to open and close the content.<br> <br>

An accordion is used to show (and hide) HTML content:</p>


  
<button onclick="myFunction('Demo1')" class="nd-btn nd-block nd-black nd-left-align">Open Section 1</button>
<div id="Demo1" class="nd-container nd-hide">
  <h4>Section 1</h4>
  <p>Some text..</p>
</div>

</div>
<script>
function myFunction(id) {
  var x = document.getElementById(id);
  if (x.className.indexOf("nd-show") == -1) {
    x.className += " nd-show";
  } else { 
    x.className = x.className.replace(" nd-show", "");
  }
}
</script>
</body>
</html>
