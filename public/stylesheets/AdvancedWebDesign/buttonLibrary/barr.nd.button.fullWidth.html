<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">

<h2>Full-width Buttons (w3-button)</h2>
<p>The <strong>w3-block</strong> class creates a full-width button.</p>
<p><button class="nd-button nd-block nd-black">Button</button></p>
<p><button class="nd-button nd-block nd-teal">Button</button></p>
<p><button class="nd-button nd-block nd-red nd-left-align">Button</button></p>

<h2>Full-width Buttons (w3-btn)</h2>
<p><button class="nd-btn nd-block nd-black">Button</button></p>
<p><button class="nd-btn nd-block nd-teal">Button</button></p>
<p><button class="nd-btn nd-block nd-red nd-left-align">Button</button></p>

</div>

</body>
</html>
