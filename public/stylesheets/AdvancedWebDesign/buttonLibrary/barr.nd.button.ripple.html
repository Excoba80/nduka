<!DOCTYPE html>
<html>

<body>

<div class="nd-container">

<h2>Buttons with Ripple Effect</h2>
<p>Click on the buttons to see the effect:</p>
<p>
  <button class="nd-button nd-ripple nd-black">Button</button>
  <button class="nd-button nd-ripple nd-red">Button</button>
  <button class="nd-button nd-ripple nd-yellow">Button</button>
</p>
<p>
  <button class="nd-btn nd-ripple nd-black">Button</button>
  <button class="nd-btn nd-ripple nd-red">Button</button>
  <button class="nd-btn nd-ripple nd-yellow">Button</button>
</p>
</div>
