<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-container">
  <h2>Button Bars</h2>

  <p>Two button groups on the same line (if enough space):</p>
  <p>   To show two (or more) button bars on the same line, add the w3-show-inline-block class: </p>
  <div class="nd-show-inline-block">
  <div class="nd-bar">
    <button class="nd-button nd-black">Button</button>
    <button class="nd-button nd-teal">Button</button>
    <button class="nd-button nd-red">Button</button>
  </div>
  </div>
  <div class="nd-show-inline-block">
  <div class="nd-bar">
    <button class="nd-button nd-black">Button</button>
    <button class="nd-button nd-teal">Button</button>
    <button class="nd-button nd-red">Button</button>
  </div>
  </div>

  <p>Two button groups on the same line (if enough space):</p>
  <div class="nd-show-inline-block">
  <div class="nd-bar">
    <button class="nd-bar-item nd-button nd-black">Button</button>
    <button class="nd-bar-item nd-button nd-teal">Button</button>
    <button class="nd-bar-item nd-button nd-red">Button</button>
  </div>
  </div>
  <div class="nd-show-inline-block">
  <div class="nd-bar">
    <button class="nd-bar-item nd-button nd-black">Button</button>
    <button class="nd-bar-item nd-button nd-teal">Button</button>
    <button class="nd-bar-item nd-button nd-red">Button</button>
  </div>
  </div>
</div>

</body>
</html>
