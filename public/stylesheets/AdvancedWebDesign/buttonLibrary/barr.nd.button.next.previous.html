<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-container">
<h2>Bar button can be used to create "previous/next" buttons:</h2>
<div class="nd-bar nd-black">
  <button class="nd-button nd-left">Left</button>
  <button class="nd-button nd-right">Right</button>
</div>

<p>Used to create "previous/next" buttons:</p>
<div class="nd-bar">
  <button class="nd-button nd-left nd-light-grey">&laquo; Previous</button>
  <button class="nd-button nd-right nd-green">Next &raquo;</button>
</div>
</div>

</body>
</html>
