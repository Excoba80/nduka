<!DOCTYPE html>
<html>
<title> Button Borders </title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css   ">
<style>
.w3-btn {margin-bottom:10px;}
</style>
<body>

<div class="nd-container">
<h2>Button Borders</h2>
<h4> Tip: Add the w3-round-size class to add rounded borders.</h4>
<p>
  <button class="nd-button nd-white nd-border">Button</button>
  <button class="nd-button nd-yellow nd-border">Button</button>
  <button class="nd-button nd-white nd-border nd-round-large">Button</button>
  <button class="nd-button nd-white nd-border nd-border-red nd-round-large">Button</button>
</p>
<p>
  <button class="nd-btn nd-white nd-border">Button</button>
  <button class="nd-btn nd-yellow nd-border">Button</button>
  <button class="nd-btn nd-white nd-border nd-round-large">Button</button>
  <button class="nd-btn nd-white nd-border nd-border-red nd-round-large">Button</button>
</p>
</div>

</body>
</html>
