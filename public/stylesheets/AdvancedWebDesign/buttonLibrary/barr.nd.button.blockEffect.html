<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-panel">
  <h2>Buttons as Blocks (w3-button)</h2>
  
  <h4>     Tip: Align the button text with the w3-left-align class or the w3-right-align class.  </h4>
  <button class="nd-button nd-block nd-black">Button</button>
  <p>The size of the block can be defined using <strong>style="width:"</strong> </p>
</div>

<div class="nd-panel" style="width:30%">
  <button class="nd-button nd-block nd-black">Button</button>
</div>

<div class="nd-panel" style="width:50%">
  <button class="nd-button nd-block nd-teal">Button</button>
</div>

<div class="nd-panel" style="width:80%">
  <button class="nd-button nd-block nd-red nd-right-align">Button</button>
</div>

<div class="nd-panel">
  <h2>Buttons as Blocks (w3-button)</h2>
  <button class="nd-btn nd-block">Button</button>
</div>

<div class="nd-panel" style="width:30%">
  <button class="nd-btn nd-block">Button</button>
</div>

<div class="nd-panel" style="width:50%">
  <button class="nd-btn nd-block nd-teal">Button</button>
</div>

<div class="nd-panel" style="width:80%">
  <button class="nd-btn nd-block nd-red nd-right-align">Button</button>
</div>

</body>
</html>
