<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
<h2>Button Bars</h2>
<p>The size of each items can be defined by using <strong>style="width:"</strong>:</p>
<div class="nd-bar">
  <button class="nd-bar-item nd-button nd-black" style="width:33.3%">Button</button>
  <button class="nd-bar-item nd-button nd-teal" style="width:33.3%">Button</button>
  <button class="nd-bar-item nd-button nd-red" style="width:33.3%">Button</button>
</div>

</div>
</body>
</html>
