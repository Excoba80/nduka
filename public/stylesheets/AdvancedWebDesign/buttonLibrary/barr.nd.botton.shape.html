<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css ">
<style>
.w3-btn {width:150px;}
</style>
<body>

<div class="nd-container">
  <h2>Button Shapes</h2>
  <p>The w3-round-size classes are used to add rounded borders to buttons:</p>
  <p><button class="nd-button nd-black nd-round-small">Round Small</button></p>
  <p><button class="nd-button nd-black nd-round">Round Normal</button></p>
  <p><button class="nd-button nd-black nd-round-large">Round Large</button></p>
  <p><button class="nd-button nd-black nd-round-xlarge">Round XLarge</button></p>
  <p><button class="nd-button nd-black nd-round-xxlarge">Round XXLarge</button></p>
</div>

</body>
</html>
