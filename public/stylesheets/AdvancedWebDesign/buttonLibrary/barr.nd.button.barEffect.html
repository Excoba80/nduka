<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
<h2>Button Bars</h2>
<p>Buttons can be grouped together in a horizontal bar using the <strong>w3-bar</strong> class:</p>
<div class="nd-bar">
  <button class="nd-button nd-black">Button</button>
  <button class="nd-button nd-teal">Button</button>
  <button class="nd-button nd-red">Button</button>
</div>
</div>

</body>
</html>
