<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
<h2>Button Bars</h2>
<p>Buttons can be grouped together without a space between them by using <strong>w3-bar-item</strong> class:</p>
<div class="nd-bar">
  <button class="nd-bar-item nd-button nd-black">Button</button>
  <button class="nd-bar-item nd-button nd-teal">Button</button>
  <button class="nd-bar-item nd-button nd-red">Button</button>
</div>

</div>
</body>
</html>
