<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
<h2>Buttons with Text Effects</h2>

<h4> Use standard HTML tags (<.i> and <.b>) to add italic or bold effect to the button text:</h4>
<p>
  <button class="nd-button nd-black">Normal</button>
  <button class="nd-button nd-black"><i>Italic</i></button>
  <button class="nd-button nd-black"><b>Bold</b></button>
</p>
<p>
  <button class="nd-btn nd-black">Normal</button>
  <button class="nd-btn nd-black"><i>Italic</i></button>
  <button class="nd-btn nd-black"><b>Bold</b></button>
</p>
</div>

</body>
</html>
