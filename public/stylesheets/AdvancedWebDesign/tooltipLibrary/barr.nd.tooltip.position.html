<div class="nd-container">
  <h2>Absolute Tooltips</h2>
  <p>If you want the tooltip to appear in an absolute position, position the tooltip text (w3-text) with CSS.</p>
  <p>Hover over the sentence below!</p>

  <p class="nd-tooltip">London <span style="position:absolute;left:0;bottom:18px" class="nd-text nd-tag">9 million inhabitants</span> is the capital of England.</p>
</div>
