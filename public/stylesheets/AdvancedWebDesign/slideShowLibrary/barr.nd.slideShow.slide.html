<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<style>
.mySlides {display:none;}
</style>
<body>
<div class = "nd-container">
<h2 class="nd-center">HTML slides</h2>

<p> The slides do not have to be images.<br> <br>

They can be any HTML content:</p>

</div>

<div class="nd-content" style="max-width:400px">
  <div class="mySlides nd-container nd-red">
    <h1><b>Did You Know?</b></h1>
    <h1><i>We plan to sell trips to the moon in the 2020s</i></h1>
  </div>

  <img class="mySlides" src="/AdvancedWebDesign/w3-images/img_monterosso.jpg" style="width:100%">

  <div class="mySlides nd-container nd-xlarge nd-white nd-card-4">
    <p><span class="nd-tag nd-yellow">New!</span>
    <p>6 Crystal Glasses</p>
    <p>Only $99 !!!</p>
  </div>

  <img class="mySlides" src="/AdvancedWebDesign/w3-images/img_manarola.jpg" style="width:100%">
</div>

<script>
var slideIndex = 0;
carousel();

function carousel() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none"; 
  }
  slideIndex++;
  if (slideIndex > x.length) {slideIndex = 1} 
  x[slideIndex-1].style.display = "block"; 
  setTimeout(carousel, 2000); 
}
</script>

</body>
</html>
