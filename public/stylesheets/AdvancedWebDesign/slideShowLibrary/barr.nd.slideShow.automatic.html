<!DOCTYPE html>
<html>

<head>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta content="text/html; charset=iso-8859-2" http-equiv="Content-Type">
<link rel="stylesheet" href="/AdvancedWebDesign/barr.nd.css  ">
<style>
.mySlides {display:none;}
</style>
</head>

<body>

<div class = "nd-container">
<h2 class="nd-center">Automatic Slideshow</h2>

<p> To display an automatic slideshow is even simpler.<br> <br>

You only need a little different JavaScript:              </p>
</div>
<div class="nd-content nd-section" style="max-width:500px">
  <img class="mySlides" src="/AdvancedWebDesign/w3-images/img_la.jpg" style="width:100%">
  <img class="mySlides" src="/AdvancedWebDesign/w3-images/img_ny.jpg" style="width:100%">
  <img class="mySlides" src="/AdvancedWebDesign/w3-images/img_chicago.jpg" style="width:100%">
</div>


<script>

alert("function is working");
var myIndex = 0;
slides();

function slides() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";  
  }
  myIndex++;
  if (myIndex > x.length) {myIndex = 1}    
  x[myIndex-1].style.display = "block";  
  setTimeout(slides, 2000); // Change image every 2 seconds
}
</script>

</body>
</html>
