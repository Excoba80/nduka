<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<style>
.mySlides {display:none;}
</style>
<body>

<div class="nd-container">
  <h2>Animated Slides</h2>
  <p>Slide or fade in an element from the top, bottom, left or right of the screen with the w3-animate-* classes.</p>
</div>

<div class="nd-content nd-section" style="max-width:500px">
  <img class="mySlides nd-animate-top" src="/AdvancedWebDesign/w3-images/img_rr_01.jpg" style="width:100%">
  <img class="mySlides nd-animate-bottom" src="/AdvancedWebDesign/w3-images/img_rr_02.jpg" style="width:100%">
  <img class="mySlides nd-animate-top" src="/AdvancedWebDesign/w3-images/img_rr_03.jpg" style="width:100%">
  <img class="mySlides nd-animate-bottom" src="/AdvancedWebDesign/w3-images/img_rr_04.jpg" style="width:100%">
</div>

<script>
var myIndex = 0;
carousel();

function carousel() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";  
  }
  myIndex++;
  if (myIndex > x.length) {myIndex = 1}    
  x[myIndex-1].style.display = "block";  
  setTimeout(carousel, 2500);    
}
</script>

</body>
</html>
