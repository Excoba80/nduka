<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<style>
.mySlides {display:none;}
</style>
<body>

<div class="nd-container">
  <h2>Slideshow Caption</h2>
  <p>Add a caption text for each image slide with the w3-display-* classes (topleft, topmiddle, topright, bottomleft, bottommiddle, bottomright or middle).</p>
</div>

<div class="nd-content nd-display-container">

<div class="nd-display-container mySlides">
  <img src="/AdvancedWebDesign/w3-images/img_snowtops.jpg" style="width:100%">
  <div class="nd-display-bottomleft nd-large nd-container nd-padding-16 nd-black">
    French Alps
  </div>
</div>

<div class="nd-display-container mySlides">
  <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" style="width:100%">
  <div class="nd-display-bottomright nd-large nd-container nd-padding-16 nd-black">
    Northern Lights
  </div>
</div>

<div class="nd-display-container mySlides">
  <img src="/AdvancedWebDesign/w3-images/img_mountains.jpg" style="width:100%">
  <div class="nd-display-topleft nd-large nd-container nd-padding-16 nd-black">
    Beautiful Mountains
  </div>
</div>

<div class="nd-display-container mySlides">
  <img src="/AdvancedWebDesign/w3-images/img_forest.jpg" style="width:100%">
  <div class="nd-display-topright nd-large nd-container nd-padding-16 nd-black">
    The Rain Forest
  </div>
</div>

<div class="nd-display-container mySlides">
  <img src="/AdvancedWebDesign/w3-images/img_mountains.jpg" style="width:100%">
  <div class="nd-display-middle nd-large nd-container nd-padding-16 nd-black">
    Mountains!
  </div>
</div>

<button class="nd-button nd-display-left nd-black" onclick="plusDivs(-1)">&#10094;</button>
<button class="nd-button nd-display-right nd-black" onclick="plusDivs(1)">&#10095;</button>

</div>

<script>
var slideIndex = 1;
showDivs(slideIndex);

function plusDivs(n) {
  showDivs(slideIndex += n);
}

function showDivs(n) {
  var i;
  var x = document.getElementsByClassName("mySlides");
  if (n > x.length) {slideIndex = 1}
  if (n < 1) {slideIndex = x.length}
  for (i = 0; i < x.length; i++) {
     x[i].style.display = "none";  
  }
  x[slideIndex-1].style.display = "block";  
}
</script>

</body>
</html>
