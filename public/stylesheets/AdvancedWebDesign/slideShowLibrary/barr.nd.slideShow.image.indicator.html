<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
  <h2>Slideshow Indicators</h2>
  <p>Using images to indicate how many slides there are in the slideshow, and highlight the image the user is currently viewing.</p>
</div>

<div class="nd-content" style="max-width:1200px">
  <img class="mySlides" src="/AdvancedWebDesign/w3-images/img_nature_wide.jpg" style="width:100%;display:none">
  <img class="mySlides" src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" style="width:100%">
  <img class="mySlides" src="/AdvancedWebDesign/w3-images/img_mountains_wide.jpg" style="width:100%;display:none">

  <div class="nd-row-padding nd-section">
    <div class="nd-col s4">
      <img class="demo nd-opacity nd-hover-opacity-off" src="/AdvancedWebDesign/w3-images/img_nature_wide.jpg" style="width:100%;cursor:pointer" onclick="currentDiv(1)">
    </div>
    <div class="nd-col s4">
      <img class="demo nd-opacity nd-hover-opacity-off" src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" style="width:100%;cursor:pointer" onclick="currentDiv(2)">
    </div>
    <div class="nd-col s4">
      <img class="demo w3-opacity nd-hover-opacity-off" src="/AdvancedWebDesign/w3-images/img_mountains_wide.jpg" style="width:100%;cursor:pointer" onclick="currentDiv(3)">
    </div>
  </div>
</div>

<script>
function currentDiv(n) {
  showDivs(slideIndex = n);
}

function showDivs(n) {
  var i;
  var x = document.getElementsByClassName("mySlides");
  var dots = document.getElementsByClassName("demo");
  if (n > x.length) {slideIndex = 1}
  if (n < 1) {slideIndex = x.length}
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" nd-opacity-off", "");
  }
  x[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " nd-opacity-off";
}
</script>

</body>
</html>
