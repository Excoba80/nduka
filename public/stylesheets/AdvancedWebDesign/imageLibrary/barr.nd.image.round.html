<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
  <h2>Rounded Images</h2>
  <p>The w3-round classes add rounded corners to an image:</p>

  <p>w3-round-small:</p>
  <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" class="nd-round-small" alt="Norway" style="width:30%">

  <p>w3-round:</p>
  <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" class="nd-round" alt="Norway" style="width:30%">

  <p>w3-round-large:</p>
  <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" class="nd-round-large" alt="Norway" style="width:30%">

  <p>w3-round-xlarge:</p>
  <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" class="nd-round-xlarge" alt="Norway" style="width:30%">

  <p>w3-round-xxlarge:</p>
  <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" class="nd-round-xxlarge" alt="Norway" style="width:30%">
</div>

</body>
</html>
