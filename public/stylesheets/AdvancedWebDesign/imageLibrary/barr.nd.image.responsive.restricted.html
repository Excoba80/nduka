<div class="nd-container">
  <h2>Responsive Image</h2>
  <p>An image can be set to <span>auto </span>matically resize itself to fit the size of its container.</p>
  <p>All you have to do is set the image width to 100%.</p>
  <p>If you want to restrict a responsive image to a maximum size, use the max-width property:</p>
  <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" alt="Lights" style="width:100%;max-width:400px">
  <p>Resize the browser window to see the effect.</p>
</div>

</body>
