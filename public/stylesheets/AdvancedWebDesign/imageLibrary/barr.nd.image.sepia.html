<div class="nd-container">
  <h2>Sepia Effect</h2>
  <p>The w3-sepia classes add a sepia effect to an element.</p>
  <p><strong>Note:</strong> The w3-sepia classes are not supported in IE 11 and earlier versions.</p>

  <p>Normal:</p>
  <img src="/AdvancedWebDesign/w3-images/img_workshop.jpg" alt="Snow" style="width:150px">
  <p>w3-sepia-min:</p>
  <img src="/AdvancedWebDesign/w3-images/img_workshop.jpg" alt="Snow" class="nd-sepia-min" style="width:150px">
  <p>w3-sepia:</p>
  <img src="/AdvancedWebDesign/w3-images/img_workshop.jpg" alt="Snow" class="nd-sepia" style="width:150px">
  <p>w3-sepia-max:</p>
  <img src="/AdvancedWebDesign/w3-images/img_workshop.jpg" alt="Snow" class="nd-sepia-max" style="width:150px">
</div>
