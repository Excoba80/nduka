<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Image Text</h2>
  <p>Position content inside an image with the w3-display-<em>classes</em> - Note that we have added the w3-container class to get more padding:</p>

  <div class="nd-display-container nd-text-white">
    <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" alt="Lights" style="width:100%">
    <div class="nd-display-topleft nd-container"><p>Top Left</p></div>
    <div class="nd-display-topright nd-container"><p>Top Right</p></div>
    <div class="nd-display-bottomleft nd-container"><p>Bottom Left</p></div>
    <div class="nd-display-bottomright nd-container"><p>Bottom Right</p></div>
    <div class="nd-display-left nd-container"><p>Left</p></div>
    <div class="nd-display-right nd-container"><p>Right</p></div>
    <div class="nd-display-middle nd-large">Middle</div>
    <div class="nd-display-topmiddle nd-container"><p>Top Middle</p></div>
    <div class="nd-display-bottommiddle nd-container"><p>Bottom Middle</p></div>
  </div>

</div>

</body>
</html>
