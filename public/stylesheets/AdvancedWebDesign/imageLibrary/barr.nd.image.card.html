<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-container">
  <h2>Image as a Card</h2>
  <p>Wrap any of the w3-card classes around the image to display it as a card:</p>
  <div class="nd-card" style="width:50%">
    <img src="/AdvancedWebDesign/w3-images/img_avatar3.png" alt="Person" style="width:100%">
    <div class="nd-container">
      <h4><b>Simon</b></h4>
      <p>The boss of all bosses</p>
    </div>
  </div>
  <br>

  <p>More shadows:</p>
  <div class="nd-card-4" style="width:50%">
    <img src="/AdvancedWebDesign/w3-images/img_avatar5.png" alt="Person" style="width:100%">
    <div class="nd-container">
      <h4><b>Jane</b></h4>
      <p>The other boss</p>
    </div>
  </div>
</div>

</body>
</html>
