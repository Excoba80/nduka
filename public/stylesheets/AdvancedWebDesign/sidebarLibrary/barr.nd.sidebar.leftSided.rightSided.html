<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-sidebar nd-bar-block nd-card nd-animate-left" style="display:none" id="leftMenu">
  <button onclick="closeLeftMenu()" class="nd-bar-item nd-button nd-large">Close &times;</button>
  <a href="#" class="nd-bar-item nd-button">Link 1</a>
  <a href="#" class="nd-bar-item nd-button  ">Link 2</a>
  <a href="#" class=" nd-bar-item nd-button  ">Link 3</a>
</div>

<div class="nd-sidebar nd-bar-block nd-card nd-animate-right" style="display:none;right:0;" id="rightMenu">
  <button onclick="closeRightMenu()" class="nd-bar-item nd-button nd-large">Close &times;</button>
  <a href="#" class="nd-bar-item nd-button">Link 1</a>
  <a href="#" class=" nd-bar-item nd-button  ">Link 2</a>
  <a href="#" class=" nd-bar-item nd-button  ">Link 3</a>
</div>

<div class="nd-teal">
  <button class="nd-button nd-teal nd-xlarge nd-left" onclick="openLeftMenu()">&#9776;</button>
  <button class="nd-button nd-teal nd-xlarge nd-right" onclick="openRightMenu()">&#9776;</button>
  <div class="nd-container">
    <h1> Left & Right Side Navigation   </h1>
  </div>
</div>

<div class="nd-container">
<p>In this example, we demonstrate how to use two side navigations.</p>
<p>We have created two "menu" buttons: one to open the side navigation from the left and one to open it from the right.</p>
</div>
     
<script>
function openLeftMenu() {
  document.getElementById("leftMenu").style.display = "block";
}

function closeLeftMenu() {
  document.getElementById("leftMenu").style.display = "none";
}

function openRightMenu() {
  document.getElementById("rightMenu").style.display = "block";
}

function closeRightMenu() {
  document.getElementById("rightMenu").style.display = "none";
}
</script>
     
</body>
</html>
