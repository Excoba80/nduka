<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Displaying Blockquotes</h2>
  <p>The w3-panel class can be used to display blockquotes:</p>

  <blockquote class="nd-panel nd-leftbar nd-light-grey">
    <p class="nd-large"><i>"Make it as simple as possible, but not simpler."</i></p>
    <p>Albert Einstein</p>
  </blockquote> 
</div>

</body>
</html>
