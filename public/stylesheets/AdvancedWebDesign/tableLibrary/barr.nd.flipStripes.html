<!DOCTYPE html>
<html>
<title>	FLIP STRIPES</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Flipped Stripes</h2>
  <p>To flip the zebra-stripes, add thead around the table header:</p>

  <table class="nd-table-all">
    <thead>
      <tr class="nd-light-grey">
        <th>First Name</th>
        <th>Last Name</th>
        <th>Points</th>
      </tr>
    </thead>
    <tr>
      <td>Jill</td>
      <td>Smith</td>
      <td>50</td>
    </tr>
    <tr>
      <td>Eve</td>
      <td>Jackson</td>
      <td>94</td>
    </tr>
    <tr>
      <td>Adam</td>
      <td>Johnson</td>
      <td>67</td>
    </tr>
    <tr>
      <td>Bo</td>
      <td>Nilson</td>
      <td>35</td>
    </tr>
  </table>
</div>

</body>
</html>
