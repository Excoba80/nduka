<!DOCTYPE html>
<html>
<title> nd-table-all </title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Table All</h2>
  <p>The w3-table-all class combines the w3-table, w3-bordered, w3-striped, and 
  w3-border classes:</p>

  <table class="nd-table-all">
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Points</th>
    </tr>
    <tr>
      <td>Jill</td>
      <td>Smith</td>
      <td>50</td>
    </tr>
    <tr>
      <td>Eve</td>
      <td>Jackson</td>
      <td>94</td>
    </tr>
    <tr>
      <td>Adam</td>
      <td>Johnson</td>
      <td>67</td>
    </tr>
    <tr>
      <td>Bo</td>
      <td>Nilson</td>
      <td>35</td>
    </tr>
  </table>
</div>

</body>
</html>
