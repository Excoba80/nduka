<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h1>The <strong>w3-display-container</strong> Class</h1>
  <p>Position of text inside an image</p>
  
  <div class="nd-display-container nd-text-white">
    <img src="  /AdvancedWebDesign/w3-images/img_lights.jpg  " alt="Lights" style="width:100%">
    <div class="nd-padding nd-display-topleft">Top Left</div>
    <div class="nd-padding nd-display-topright">Top Right</div>
    <div class="nd-padding nd-display-bottomleft">Bottom Left</div>
    <div class="nd-padding nd-display-bottomright">Bottom Right</div>
    <div class="nd-padding nd-display-topmiddle">Top Mid</div>
    <div class="nd-padding nd-display-left">Left</div>
    <div class="nd-padding nd-display-right">Right</div>
    <div class="nd-padding nd-display-middle nd-xxlarge">Middle</div>
    <div class="nd-padding nd-display-bottommiddle">Bottom Mid</div>
  </div>
</div>

</body>        
</html>
