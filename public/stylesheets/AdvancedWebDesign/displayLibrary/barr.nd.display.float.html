<!DOCTYPE html>
<html>
<title>Display Float</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Floating Classes</h2>
  <p>The w3-left class floats an element to the left, and the w3-right class floats an element to the right:</p>
  
  <div class="nd-bar nd-light-grey">
    <div class="nd-left nd-red nd-padding">w3-left</div>
    <div class="nd-right nd-blue nd-padding">w3-right</div>
  </div>
</div>

</body>
</html>
