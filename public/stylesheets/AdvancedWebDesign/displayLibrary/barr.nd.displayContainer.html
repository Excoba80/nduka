<!DOCTYPE html>
<html>
<title>Display Container</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h1>Using w3-display-container</h1>

  <div class="nd-display-container nd-green" style="height:300px;">
    <div class="nd-display-topleft">Top Left</div>
    <div class="nd-display-topright">Top Right</div>
    <div class="nd-display-bottomleft">Bottom Left</div>
    <div class="nd-display-bottomright">Bottom Right</div>
    <div class="nd-display-left">Left</div>
    <div class="nd-display-right">Right</div>
    <div class="nd-display-middle">Middle</div>
    <div class="nd-display-topmiddle nd-hide-small">Top Middle</div>
    <div class="nd-display-bottommiddle nd-hide-small">Bottom Middle</div>
  </div>
</div>

</body>
</html>
