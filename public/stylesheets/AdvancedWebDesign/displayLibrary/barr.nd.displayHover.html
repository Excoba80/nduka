<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
  <h1>The <strong>w3-display-hover</strong> Class</h1>
  <p>The w3-display-hover class displays content on hover inside a w3-display-container (goes from hidden to shown).</p>
  
  <div class="nd-display-container nd-light-grey" style="height:300px;">
    <div class="nd-display-topleft nd-display-hover">Top Left</div>
    <div class="nd-display-topright nd-display-hover">Top Right</div>
    <div class="nd-display-bottomleft nd-display-hover">Bottom Left</div>
    <div class="nd-display-bottomright nd-display-hover">Bottom Right</div>
    <div class="nd-display-left nd-display-hover">Left</div>
    <div class="nd-display-right nd-display-hover">Right</div>
    <div class="nd-display-middle">Mouse over this box!</div>
    <div class="nd-display-topmiddle nd-display-hover">Top Mid</div>
    <div class="nd-display-bottommiddle nd-display-hover">Bottom Mid</div>
  </div>
</div>

</body>
</html>
