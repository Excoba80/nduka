<!DOCTYPE html>
<html>
<title>Toggle Show/Hide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="-cndontainer">
  <h2>Toggle Show/Hide</h2>
  <p>Click on the button to show/hide a paragraph.</p>
  <button onclick="myFunction()" class="nd-btn nd-black">Toggle hide and show</button>

  <p>Paragraph 1.</p>
  <p id="Demo" class="nd-hide nd-red">Paragraph 2.</p>
</div>

<script>
function myFunction() {
  var x = document.getElementById("Demo");
  if (x.className.indexOf("nd-show") == -1) {
    x.className += " nd-show";
  } else {
    x.className = x.className.replace(" nd-show", "");
  }
}
</script>

</body>
</html>
