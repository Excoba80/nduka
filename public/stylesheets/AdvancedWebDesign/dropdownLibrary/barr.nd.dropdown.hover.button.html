<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css     ">
<body>

<div class="nd-container">
  <h2>Dropdown Button</h2>
  
  <p>    The <b>w3-dropdown-hover</b> class defines a hoverable dropdown element.<br>

The <b>w3-dropdown-content </b> class defines the dropdown content to be displayed.   </p>
  <p>Move the mouse over the button to open the dropdown content.</p>
  <div class="nd-dropdown-hover">
    <button class="nd-button nd-black">Hover Over Me!</button>
    <div class="nd-dropdown-content nd-bar-block nd-border">
      <a href="#" class="nd-bar-item nd-button">Link 1</a>
      <a href="#" class="nd-bar-item nd-button">Link 2</a>
      <a href="#" class="nd-bar-item nd-button">Link 3</a>
    </div>
  </div>
</div>

</body>
</html>
