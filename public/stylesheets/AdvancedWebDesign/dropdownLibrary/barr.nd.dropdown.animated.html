<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
  <h2>Animated Dropdown</h2>
  <p>Use any of the w3-animate-classes to fade, zoom or slide in the dropdown content (w3-animate-zoom|opacity|top|bottom|left|right).</p>

  <div class="nd-dropdown-click">
    <button onclick="myFunction()" class="nd-button nd-black">Click me</button>
    <div id="Demo" class="nd-dropdown-content nd-bar-block nd-card-4 nd-animate-zoom">
      <a href="#" class="nd-bar-item nd-button">Link 1</a>
      <a href="#" class="nd-bar-item nd-button">Link 2</a>
      <a href="#" class="nd-bar-item nd-button">Link 3</a>
    </div>
  </div>
</div>

<script>
function myFunction() {
  var x = document.getElementById("Demo");
  if (x.className.indexOf("nd-show") == -1) {
    x.className += " nd-show";
  } else { 
    x.className = x.className.replace(" nd-show", "");
  }
}
</script>

</body>
</html>
