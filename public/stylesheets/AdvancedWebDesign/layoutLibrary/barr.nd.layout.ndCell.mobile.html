</div>

<div class="nd-cell-row">
  <div class="nd-container nd-red nd-cell nd-mobile">
    <p>Hello W3.CSS Layout.</p>
  </div>

    <p>Hello W3.CSS Layout.</p>
  </div>
  <div class="nd-container nd-blue nd-cell nd-mobile">
    <p>Hello W3.CSS Layout. Hello W3.CSS Layout.</p>
  </div>
</div>

</body>
