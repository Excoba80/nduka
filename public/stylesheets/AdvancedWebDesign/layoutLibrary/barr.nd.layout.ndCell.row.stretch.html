<body>

<div class="nd-container">
  <h2>Layout Container</h2>
  <p>The w3-cell-row class stretches the elements to fit the page width.</p>
  <p>Resize the browser window to see the effect.</p>
</div>

<div class="nd-cell-row">
  <div class="nd-container nd-red nd-cell nd-cell-top">
    <p>Hello W3.CSS Layout.</p>
    <p>Hello W3.CSS Layout.</p>
    <p>Hello W3.CSS Layout.</p>
    <p>Hello W3.CSS Layout.</p>
  </div>
  <div class="nd-container nd-green nd-cell nd-cell-middle">
    <p>Hello W3.CSS Layout.</p>
  </div>
  <div class="nd-container nd-blue nd-cell nd-cell-bottom">
    <p>Hello W3.CSS Layout.</p>
  </div>
</div>

</body>
</html>
