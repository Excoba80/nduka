<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body class="nd-container">
<h2>Stretch</h2>

<p>The w3-stretch class removes the right and left margins from an element. This class is often used to stretch a padded row:</p>

<p>An example with w3-stretch:</p>
<div class="nd-row-padding nd-section nd-stretch">
  <div class="nd-col s4">
    <img src="/AdvancedWebDesign/w3-images/img_nature_wide.jpg" style="width:100%">
  </div>
  <div class="nd-col s4">
    <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" style="width:100%">
  </div>
  <div class="nd-col s4">
    <img src="/AdvancedWebDesign/w3-images/img_mountains_wide.jpg" style="width:100%">
  </div>
</div>

<p>An example without w3-stretch:</p>
<div class="nd-row-padding nd-section">
  <div class="nd-col s4">
    <img src="/AdvancedWebDesign/w3-images/img_nature_wide.jpg" style="width:100%">
  </div>
  <div class="nd-col s4">
    <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" style="width:100%">
  </div>
  <div class="nd-col s4">
    <img src="/AdvancedWebDesign/w3-images/img_mountains_wide.jpg" style="width:100%">
  </div>
</div>

</body>
</html>
