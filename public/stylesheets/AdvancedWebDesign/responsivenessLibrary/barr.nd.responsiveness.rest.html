<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="    /AdvancedWebDesign/barr.nd.css    ">
<body>

<div class="nd-container">
  <h2>Using w3-rest</h2>
  <p>The w3-rest class will use what's left of the grid column.</p>
</div>

<div class="nd-row">
  <div class="nd-col nd-container nd-blue" style="width:150px"><p>150px</p></div>
  <div class="nd-rest nd-container nd-green"><p>w3-rest</p></div>
</div>
<br>

<div class="nd-row">
  <div class="nd-col nd-right nd-container nd-blue" style="width:75px"><p>75px</p></div>
  <div class="nd-rest nd-container nd-green"><p>w3-rest</p></div>
</div>
<br>

<div class="nd-row">
  <div class="nd-col nd-left nd-container nd-blue" style="width:100px"><p>100px</p></div>
  <div class="nd-col nd-right nd-container nd-blue" style="width:100px"><p>100px</p></div>
  <div class="nd-rest nd-container nd-green"><p>w3-rest</p></div>
</div>
<br>

<div class="nd-row">
  <div class="nd-quarter nd-container nd-red"><p>quarter</p></div>
  <div class="nd-half">
    <div class="nd-row">
      <div class="nd-col nd-container nd-blue" style="width:80px"><p>80px</p></div>
      <div class="nd-rest nd-container nd-green"><p>w3-rest</p></div>
    </div>
  </div>
  <div class="nd-quarter nd-container nd-purple"><p>quarter</p></div>
</div>
<br>

<div class="nd-row">
  <div class="nd-quarter nd-container nd-red"><p>quarter</p></div>
  <div class="nd-quarter nd-container nd-purple"><p>quarter</p></div>
  <div class="nd-half">
    <div class="nd-row">
      <div class="nd-col nd-container nd-blue" style="width:35%"><p>35%</p></div>
      <div class="nd-rest nd-container nd-green"><p>w3-rest</p></div>
    </div>
  </div>
</div>

</body>
</html>
