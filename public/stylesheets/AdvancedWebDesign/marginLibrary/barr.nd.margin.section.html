<!DOCTYPE html>
<html>
<title>Section Margin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
  <h2>Displaying Sections</h2>
  <p>The w3-section class adds a 16px top and bottom margin to any HTML element, and can be used to separate sections of HTML content:</p>
</div>
<div class="nd-container nd-blue">
  <h1>I am Blue</h1>
</div>
<div class="nd-container nd-green">
  <h1>I am Green</h1>
</div>

<div class="nd-container nd-section nd-blue">
  <h1>I am Blue</h1>
</div>
<div class="nd-container nd-section nd-green">
  <h1>I am Green</h1>
</div>

</body>
</html>
