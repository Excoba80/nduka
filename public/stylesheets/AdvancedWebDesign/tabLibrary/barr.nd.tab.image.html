<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-container">
  <h2>Tabbed Image Gallery</h2>
  <p>Click on the images below:</p>
</div>

<div class="nd-row-padding">
  <div class="nd-col s3 nd-container">
  <a href="javascript:void(0)" class="nd-hover-opacity" onclick="openImg('Nature');">
    <img src="/AdvancedWebDesign/w3-images/img_nature.jpg" alt="Nature" style="width:100%">
  </a>
  </div>
  <div class="nd-col s3 nd-container">
    <a href="javascript:void(0)" class="nd-hover-opacity" onclick="openImg('Snow');">
      <img src="/AdvancedWebDesign/w3-images/img_snowtops.jpg" alt="Snow" style="width:100%">
    </a>
  </div>
  <div class="nd-col s3 nd-container">
    <a href="javascript:void(0)" class="nd-hover-opacity" onclick="openImg('Mountains');">
      <img src="/AdvancedWebDesign/w3-images/img_mountains.jpg" alt="Mountains" style="width:100%">
    </a>
  </div>
  <div class="nd-col s3 nd-container">
    <a href="javascript:void(0)" class="nd-hover-opacity" onclick="openImg('Lights');">
      <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" alt="Lights" style="width:100%">
    </a>
  </div>
</div><br>

<div id="Nature" class="picture nd-display-container" style="display:none">
  <img src="/AdvancedWebDesign/w3-images/img_nature_wide.jpg" alt="Nature" style="width:100%">
  <span onclick="this.parentElement.style.display='none'" 
  class="nd-display-topright nd-button nd-transparent nd-text-white">&times;</span>
  <div class="nd-display-bottomleft nd-container nd-padding nd-text-white">Nature</div>
</div>

<div id="Snow" class="picture nd-display-container" style="display:none">
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" alt="Snow" style="width:100%">
  <span onclick="this.parentElement.style.display='none'" 
  class="nd-display-topright nd-button nd-transparent nd-text-white">&times;</span>
  <div class="nd-display-bottomleft nd-container nd-padding nd-text-white">Snow</div>
</div>

<div id="Mountains" class="picture nd-display-container" style="display:none">
  <img src="/AdvancedWebDesign/w3-images/img_mountains_wide.jpg" alt="Mountains" style="width:100%">
  <span onclick="this.parentElement.style.display='none'" 
  class="nd-display-topright nd-button nd-transparent">&times;</span>
  <div class="nd-display-bottomleft nd-container nd-padding nd-text-white">Mountains</div>
</div>

<div id="Lights" class="picture w3-display-container" style="display:none">
  <img src="/AdvancedWebDesign/w3-images/img_lights_wide.jpg" alt="Lights" style="width:100%">
  <span onclick="this.parentElement.style.display='none'" 
  class="nd-display-topright nd-button nd-transparent nd-text-white">&times;</span>
  <div class="nd-display-bottomleft nd-container nd-padding nd-text-white">Northern Lights</div>
</div>

<script>
function openImg(imgName) {
  var i, x;
  x = document.getElementsByClassName("picture");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  document.getElementById(imgName).style.display = "block";
}
</script>

</body>
</html>
