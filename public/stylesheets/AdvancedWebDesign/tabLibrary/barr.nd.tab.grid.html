<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Tabs in a Grid</h2>
  
  <p>  
Using tabs in a third column layout. Note that we add a bottom border to the active tab, instead of a background color:   </p>

  <div class="nd-row">
    <a href="javascript:void(0)" onclick="openCity(event, 'London');">
      <div class="nd-third tablink nd-bottombar nd-hover-light-grey nd-padding">London</div>
    </a>
    <a href="javascript:void(0)" onclick="openCity(event, 'Paris');">
      <div class="nd-third tablink nd-bottombar nd-hover-light-grey nd-padding  ">Paris</div>
    </a>
    <a href="javascript:void(0)" onclick="openCity(event, 'Tokyo');">
      <div class="nd-third tablink nd-bottombar nd-hover-light-grey nd-padding  ">Tokyo</div>
    </a>
  </div>

  <div id="London" class="nd-container city" style="display:none">
    <h2>London</h2>
    <p>London is the capital city of England.</p>
  </div>

  <div id="Paris" class="nd-container city" style="display:none">
    <h2>Paris</h2>
    <p>Paris is the capital of France.</p> 
  </div>

  <div id="Tokyo" class="nd-container city" style="display:none">
    <h2>Tokyo</h2>
    <p>Tokyo is the capital of Japan.</p>
  </div>
</div>

<script>
function openCity(evt, cityName) {
  var i, x, tablinks;
  x = document.getElementsByClassName("city");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablink");
  for (i = 0; i < x.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" nd-border-red", "");
  }
  document.getElementById(cityName).style.display = "block";
  evt.currentTarget.firstElementChild.className += " nd-border-red";
}
</script>

</body>
</html>
