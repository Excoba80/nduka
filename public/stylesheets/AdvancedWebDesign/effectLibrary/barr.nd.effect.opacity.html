<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="    /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Opacity Effect</h2>
  <p>The w3-opacity classes add a transparency effect to an element.</p>

  <p>Normal:</p>
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" style="width:300px">
  <p>w3-opacity-min:</p>
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" class="nd-opacity-min" style="width:300px">
  <p>w3-opacity:</p>
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" class="nd-opacity" style="width:300px">
  <p>w3-opacity-max:</p>
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" class="nd-opacity-max" style="width:300px">

  <div class="nd-panel nd-red nd-opacity">
    <p>Red with opacity</p>
  </div>
  <div class="nd-panel nd-blue nd-opacity">
    <p>Blue with opacity</p>
  </div>
  <div class="nd-panel nd-green nd-opacity">
    <p>Green with opacity</p>
  </div>
</div>

</body>
</html>
