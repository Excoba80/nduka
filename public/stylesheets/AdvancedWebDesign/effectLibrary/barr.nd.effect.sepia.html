<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="    /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Sepia Effect</h2>
  <p>The w3-sepia classes add a sepia effect to an element.</p>
  <p><strong>Note:</strong> The w3-sepia classes are not supported in IE 11 and earlier versions.</p>

  <p>Normal:</p>
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" alt="Snow" style="width:300px">
  <p>w3-sepia-min:</p>
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" alt="Snow" class="nd-sepia-min" style="width:300px">
  <p>w3-sepia:</p>
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" alt="Snow" class="nd-sepia" style="width:300px">
  <p>w3-sepia-max:</p>
  <img src="/AdvancedWebDesign/w3-images/img_snow_wide.jpg" alt="Snow" class="nd-sepia-max" style="width:300px">

  <div class="nd-panel nd-red nd-sepia">
    <p>Red with sepia</p>
  </div>
  <div class="nd-panel nd-blue nd-sepia">
    <p>Blue with sepia</p>
  </div>
  <div class="nd-panel nd-green nd-sepia">
    <p>Green with sepia</p>
  </div>
</div>

</body>
</html>
