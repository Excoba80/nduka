<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Three Unequal Columns</h2>
  <p>Three various-width columns (25%/50%/25%) on tablets, laptops and desktops. On mobile phones, the columns will automatically stack (100% width).</p>
  <p>Try to resize the browser window to see the effect.</p>
</div>

<div class="nd-row">
  <div class="nd-col m3 nd-green nd-center">
    <p>m3</p>
  </div>
  <div class="nd-col m6 nd-dark-grey nd-center">
    <p>m6</p>
  </div>
  <div class="nd-col m3 nd-red nd-center">
    <p>m3</p>
  </div>
</div>

<div class="nd-row nd-container">
  <p>Inside a container:</p>
  <div class="nd-col m3 nd-green nd-center">
    <p>m3</p>
  </div>
  <div class="nd-col m6 nd-dark-grey nd-center">
    <p>m6</p>
  </div>
  <div class="nd-col m3 nd-red nd-center">
    <p>m3</p>
  </div>
</div>

</body>
</html>
