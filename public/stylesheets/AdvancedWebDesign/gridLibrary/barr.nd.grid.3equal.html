<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Three Equal Columns</h2>
  <p>Three equal-width columns (33.3%/33.3%/33.3%) on all screen sizes:</p>
</div>

<div class="nd-row">
  <div class="nd-col s4 nd-green nd-center">
    <p>s4</p>
  </div>
  <div class="nd-col s4 nd-dark-grey nd-center">
    <p>s4</p>
  </div>
  <div class="nd-col s4 nd-red nd-center">
    <p>s4</p>
  </div>
</div>

<div class="nd-row nd-container">
  <p>Inside a container:</p>
  <div class="nd-col s4 nd-green nd-center">
    <p>s4</p>
  </div>
  <div class=" nd-col s4 nd-green nd-center">
    <p>s4</p>
  </div>
  <div class=" nd-col s4 nd-green nd-center ">
    <p>s4</p>
  </div>
</div>

</body>
</html>
