<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Two Unequal Columns</h2>
  <p>Two columns of unequal width (25%/75%) on all screen sizes:</p>
</div>

<div class="nd-row">
  <div class="nd-col s3 nd-green nd-center">
    <p>s3</p>
  </div>
  <div class="nd-col s9 nd-dark-grey nd-center">
    <p>s9</p>
  </div>
</div>

<div class="nd-row nd-container">
  <p>Inside a container:</p>
  <div class="nd-col s3 nd-green nd-center">
    <p>s3</p>
  </div>
  <div class="nd-col s9 nd-dark-grey nd-center">
    <p>s9</p>
  </div>
</div>

</body>
</html>
