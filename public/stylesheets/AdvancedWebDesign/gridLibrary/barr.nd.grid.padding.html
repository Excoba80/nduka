<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h3>Difference between w3-row and w3-row-padding</h3>
  <p>The w3-row class defines a padded-less container:</p>
</div>

  <div class="nd-row">
    <div class="nd-col s4">
      <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" style="width:100%">
    </div>
    <div class="nd-col s4">
      <img src="/AdvancedWebDesign/w3-images/img_nature.jpg" style="width:100%">
    </div>
    <div class="nd-col s4">
      <img src="/AdvancedWebDesign/w3-images/img_snowtops.jpg" style="width:100%">
    </div>
  </div>

<div class="nd-container">
  <p>The w3-row-padding class adds a 8px left and right padding to each column:</p>
</div>

  <div class="nd-row-padding">
    <div class="nd-col s4">
      <img src="/AdvancedWebDesign/w3-images/img_lights.jpg" style="width:100%">
    </div>
    <div class="nd-col s4">
      <img src="/AdvancedWebDesign/w3-images/img_nature.jpg" style="width:100%">
    </div>
    <div class="nd-col s4">
      <img src="/AdvancedWebDesign/w3-images/img_snowtops.jpg" style="width:100%">
    </div>
  </div>

</body>
</html>
