<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
<h2>Using Percent</h2>
<p>Use the CSS width property to determine a specific width of the columns.</p>
</div>

<div class="nd-row">
  <div class="nd-col nd-green nd-container" style="width:20%"><p>20%</p></div>
  <div class="nd-col nd-blue nd-container" style="width:60%"><p>60%</p></div>
  <div class="nd-col nd-red nd-container" style="width:20%"><p>20%</p></div>
</div>
<br>

<div class="nd-row">
  <div class="nd-col nd-green nd-container" style="width:45%"><p>45%</p></div>
  <div class="nd-col nd-dark-grey nd-container" style="width:55%"><p>55%</p></div>
</div>
<br>

<div class="nd-row">
  <div class="nd-col nd-green nd-container" style="width:15%"><p>15%</p></div>
  <div class="nd-col nd-dark-grey nd-container" style="width:35%"><p>35%</p></div>
  <div class="nd-col nd-red nd-container" style="width:10%"><p>10%</p></div>
  <div class="nd-col nd-blue nd-container" style="width:30%"><p>30%</p></div>
  <div class="nd-col nd-purple nd-container" style="width:10%"><p>10%</p></div>
</div>

</body>
</html>
