<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Six Columns</h2>
  <p>Six equal-width columns (16% each) on tablets, laptops and desktops. On mobile phones, the columns will automatically stack (100% width):</p>
  <p>Try to resize the browser window to see the effect.</p>
</div>

<div class="nd-row">
  <div class="nd-col m2 nd-green nd-center">
    <p>m2</p>
  </div>
  <div class="nd-col m2 nd-red nd-center">
    <p>m2</p>
  </div>
  <div class="nd-col m2 nd-blue nd-center">
    <p>m2</p>
  </div>
  <div class="nd-col m2 nd-dark-grey nd-center">
    <p>m2</p>
  </div>
  <div class="nd-col m2 nd-black nd-center">
    <p>m2</p>
  </div>
  <div class="nd-col m2 nd-purple nd-center">
    <p>m2</p>
  </div>
</div>

<div class="nd-row nd-container">
  <p>Inside a container:</p>
  <div class="nd-row">
    <div class="nd-col m2 nd-green nd-center">
      <p>m2</p>
    </div>
    <div class="nd-col m2 nd-red nd-center">
      <p>m2</p>
    </div>
    <div class="nd-col m2 nd-blue nd-center">
      <p>m2</p>
    </div>
    <div class="nd-col m2 nd-dark-grey nd-center">
      <p>m2</p>
    </div>
    <div class="nd-col m2 nd-black nd-center">
      <p>m2</p>
    </div>
    <div class="nd-col m2 nd-purple nd-center">
      <p>m2</p>
    </div>
  </div>
</div>

</body>
</html>
