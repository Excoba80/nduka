<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="    /AdvancedWebDesign/barr.nd.css   ">
<body>
<div class="nd-container">

<h2>Hover Colors</h2>

<p>You can use any hover color to style a bar:</p>
<p>Mouse over the bar items to see the effect:</p>

<div class="nd-bar nd-black">
  <div class="nd-bar-item nd-hover-red">London</div>
  <div class="nd-bar-item nd-hover-green ">Paris</div>
  <div class="nd-bar-item nd-hover-blue">Tokyo</div>
</div>
<br>
<div class="nd-bar-block nd-black" style="width:120px">
  <div class="nd-bar-item nd-hover-red">London</div>
  <div class="nd-bar-item nd-hover-green ">Paris</div>
  <div class="nd-bar-item nd-hover-blue">Tokyo</div>
</div>

</div>
</body>
</html>
