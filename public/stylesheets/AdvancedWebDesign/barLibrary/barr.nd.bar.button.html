<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css    ">
<body>
<div class="nd-container">

<h2>Bar Button</h2>
<p> The <b>w3-button </b> class is perfect for styling links in a bar.<br>

Mouse over the bar items to see the effect:   </p>
<div class="nd-bar nd-black">
  <a href="#" class="nd-bar-item nd-button">London</a>
  <a href="#" class="nd-bar-item nd-button">Paris</a>
  <a href="#" class="nd-bar-item nd-button">Tokyo</a>
</div>
<br>
<div class="nd-bar-block nd-black" style="width:120px">
  <a href="#" class="nd-bar-item nd-button">London</a>
  <a href="#" class="nd-bar-item nd-button">Paris</a>
  <a href="#" class="nd-bar-item nd-button">Tokyo</a>
</div>

</div>
</body>
</html>
