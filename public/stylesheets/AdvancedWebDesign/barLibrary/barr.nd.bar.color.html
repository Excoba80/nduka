<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css   ">
<body>
<div class="nd-container">

<h2>Bar Colors</h2>

<p>You can use any color to style a bar:</p>

<div class="nd-bar nd-black">
  <div class="nd-bar-item">London</div>
  <div class="nd-bar-item">Paris</div>
  <div class="nd-bar-item">Tokyo</div>
</div>
<br>
<div class="nd-bar nd-red">
  <div class="nd-bar-item">London</div>
  <div class="nd-bar-item">Paris</div>
  <div class="nd-bar-item">Tokyo</div>
</div>
<br>
<div class="nd-bar-block nd-black" style="width:120px">
  <div class="nd-bar-item">London</div>
  <div class="nd-bar-item">Paris</div>
  <div class="nd-bar-item">Tokyo</div>
</div>
<br>
<div class="nd-bar-block nd-red" style="width:120px">
  <div class="nd-bar-item">London</div>
  <div class="nd-bar-item">Paris</div>
  <div class="nd-bar-item">Tokyo</div>
</div>

</div>
</body>
</html>
