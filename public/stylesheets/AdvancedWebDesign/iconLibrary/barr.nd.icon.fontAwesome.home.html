<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css   ">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<body>

<div class="nd-container">
  <h1>Using Font Awesome Icons</h1>

  <div class="nd-padding nd-xlarge nd-teal">
    <i class="fa fa-home"></i>
    <i class="fa fa-search"></i>
    <i class="fa fa-cloud"></i>
    <i class="fa fa-trash"></i>
    Welcome!
  </div>

  <div class="nd-padding nd-xlarge nd-text-orange">
    <i class="fa fa-home"></i>
    <i class="fa fa-search"></i>
    <i class="fa fa-cloud"></i>
    <i class="fa fa-trash"></i>
    Welcome!
  </div>

  <ul class="nd-ul">
    <li><i class="fa fa-home"></i> Home</li>
    <li class="nd-large"><i class="fa fa-home"></i> Home</li>
    <li class="nd-xlarge"><i class="fa fa-home"></i> Home</li>
    <li class="nd-xxlarge"><i class="fa fa-home"></i> Home</li>
    <li class="nd-xxxlarge"><i class="fa fa-home"></i> Home</li>
    <li class="nd-jumbo nd-teal"><i class="fa fa-home"></i> Home</li>
  </ul>

  <p><button class="nd-btn nd-orange nd-xlarge">Button<i class="nd-margin-left fa fa-home"></i></button></p>

  <p><i class="nd-jumbo nd-spin fa fa-home"></i></p>
</div>

</body>
</html>
