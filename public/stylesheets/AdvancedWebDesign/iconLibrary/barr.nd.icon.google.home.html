<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="    /AdvancedWebDesign/barr.nd.css   ">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
.material-icons {vertical-align:-14%}
</style>
<body>

<div class="nd-container">
  <h1>Using Google Icons</h1>

  <div class="nd-padding nd-xlarge nd-teal">
    <i class="material-icons">home</i>
    <i class="material-icons">search</i>
    <i class="material-icons">cloud</i>
    <i class="material-icons">delete</i>
    Welcome!
  </div>

 <div class="nd-padding nd-xlarge nd-text-orange">
    <i class="material-icons">home</i>
    <i class="material-icons">search</i>
    <i class="material-icons">cloud</i>
    <i class="material-icons">delete</i>
    Welcome!
  </div>

  <ul class="nd-ul">
    <li><i class="material-icons">home</i> Home</li>
    <li class="nd-large"><i class="material-icons nd-large">home</i> Home</li>
    <li class="nd-xlarge"><i class="material-icons nd-xlarge">home</i> Home</li>
    <li class="nd-xxlarge"><i class="material-icons nd-xxlarge">home</i> Home</li>
    <li class="nd-xxxlarge"><i class="material-icons nd-xxxlarge">home</i> Home</li>
    <li class="nd-jumbo w3-teal"><i class="material-icons nd-jumbo">home</i> Home</li>
  </ul>

  <p><button class="nd-btn nd-orange nd-xlarge">Button<i class="nd-margin-left material-icons">home</i></button></p>

  <p><i class="material-icons nd-spin nd-jumbo">home</i></p>
</div>

</body>
</html>
