<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/AdvancedWebDesign/barr.nd.css    ">
<body>
<div class="nd-container">

<h2>Progress Bar Padding</h2>
<p>Add text inside a w3-container element to add a label to a progress bar.</p>
<p>Use a w3-padding class to add padding to the container.</p>

<div class="nd-section nd-light-grey">
  <div class="nd-container nd-padding-small nd-red nd-center" style="width:50%">50%</div>
</div>

<div class="nd-section nd-light-grey">
  <div class="nd-container nd-padding nd-red nd-red nd-center" style="width:50%">50%</div>
</div>

<div class="nd-section nd-light-grey">
  <div class="nd-container nd-padding-large nd-red nd-center" style="width:50%">50%</div>
</div>

</div>
</body>
</html>
