<!DOCTYPE html>

<body>
<div class="nd-container">

<h2>Progress Bar Colors</h2>
<p>Use any of the w3-color classes to change the color of the progress bar.</p>

<div class="nd-light-grey">
  <div class="nd-green" style="height:24px;width:25%"></div>
</div><br>

<div class="nd-light-grey">
  <div class="nd-red" style="height:24px;width:50%"></div>
</div><br>

  <div class="nd-blue" style="height:24px;width:75%"></div>
</div>

</div>
