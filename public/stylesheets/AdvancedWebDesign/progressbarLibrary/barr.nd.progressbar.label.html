<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css   ">
<body>
<div class="nd-container">

<h2>Progress Bar Labels</h2>
<p>Add text inside a w3-container element to add a label to the progress bar.</p>
<p>Use the w3-center class to center the label. If omitted, it will be left aligned.</p>

<div class="nd-light-grey">
  <div class="nd-container nd-green nd-center" style="width:25%">25%</div>
</div><br>

<div class="nd-light-grey">
  <div class="nd-container nd-red nd-center" style="width:50%">50%</div>
</div><br>

<div class="nd-light-grey">
  <div class="nd-container nd-blue" style="width:75%">75%</div>
</div><br>

</div>
</body>
</html>
