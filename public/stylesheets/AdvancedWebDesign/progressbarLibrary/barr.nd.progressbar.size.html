<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
  <h2>Progress Bar Size</h2>
  <p>Use a w3-<em>size</em> class (w3-small, w3-large) to change the size of the progress bar:</p>

  <p>w3-tiny:</p>
  <div class="nd-light-grey nd-tiny">
    <div class="nd-container nd-green" style="width:50%">50%</div>
  </div>

  <p>w3-small:</p>
  <div class="nd-light-grey nd-small">
    <div class="nd-container nd-green" style="width:50%">50%</div>
  </div>

  <p>Default:</p>
  <div class="nd-light-grey">
    <div class="nd-container nd-green" style="width:50%">50%</div>
  </div>

  <p>w3-large:</p>
  <div class="nd-light-grey nd-large">
    <div class="nd-container nd-green" style="width:50%">50%</div>
  </div>

  <p>w3-xlarge:</p>
  <div class="nd-light-grey nd-xlarge">
    <div class="nd-container nd-green" style="width:50%">50%</div>
  </div>
  
  <p>w3-xxlarge:</p>
  <div class="nd-light-grey nd-xxlarge">
    <div class="nd-container nd-green" style="width:50%">50%</div>
  </div>
</div>

</body>
</html>
