<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Rounded Progress Bars</h2>
  <p>Use any of the <strong>w3-round</strong> classes to add rounded corners to progress bars:</p>

  <div class="nd-light-grey nd-round">
    <div class="nd-container nd-blue nd-round" style="width:25%">25%</div>
  </div><br>

  <div class="nd-light-grey nd-round-large">
    <div class="nd-container nd-blue nd-round-large" style="width:25%">25%</div>
  </div><br>

  <div class="nd-light-grey nd-round-xlarge">
    <div class="nd-container nd-blue nd-round-xlarge" style="width:25%">25%</div>
  </div>
</div>

</body>
</html>
