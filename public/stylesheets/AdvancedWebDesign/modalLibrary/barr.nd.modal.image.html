<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
  <h2>W3.CSS Modal Image</h2>
  <p>Click on the image to display it in full size:</p>

  <img src="/AdvancedWebDesign/w3-images/img_snowtops.jpg" style="width:30%;cursor:zoom-in"
  onclick="document.getElementById('modal01').style.display='block'">

  <div id="modal01" class="nd-modal" onclick="this.style.display='none'">
    <span class="nd-button nd-hover-red nd-xlarge nd-display-topright">&times;</span>
    <div class="nd-modal-content nd-animate-zoom">
      <img src="/AdvancedWebDesign/w3-images/img_snowtops.jpg" style="width:100%">
    </div>
  </div>
</div>
            
</body>
</html>
