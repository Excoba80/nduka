<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-container">
  <h2>W3.CSS Modal Image Gallery</h2>
  <p>Click on the images to display them in full size.</p>
</div>

<div class="nd-row-padding">
  <div class="nd-container nd-third">
    <img src="/AdvancedWebDesign/w3-images/img_snowtops.jpg" style="width:100%;cursor:pointer" 
    onclick="onClick(this)" class="nd-hover-opacity">
  </div>
  <div class="nd-container nd-third">
    <img src="  /AdvancedWebDesign/w3-images/img_lights.jpg" style="width:100%;cursor:pointer" 
    onclick="onClick(this)" class="nd-hover-opacity">
  </div>
  <div class="nd-container nd-third">
    <img src="/AdvancedWebDesign/w3-images/img_mountains.jpg" style="width:100%;cursor:pointer" 
    onclick="onClick(this)" class="nd-hover-opacity">
  </div>
</div>

<div id="modal01" class="nd-modal" onclick="this.style.display='none'">
  <span class="nd-button nd-hover-red nd-xlarge nd-display-topright">&times;</span>
  <div class="nd-modal-content nd-animate-zoom">
    <img id="img01" style="width:100%">
  </div>
</div>

<script>
function onClick(element) {
  document.getElementById("img01").src = element.src;
  document.getElementById("modal01").style.display = "block";
}
</script>
            
</body>
</html>
