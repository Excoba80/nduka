<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<style> 


.azuka-container,.azuka-panel{padding:0.01em 16px}.w3-panel{margin-top:16px;margin-bottom:16px}

.modal{z-index:3;display:none;padding-top:100px;position:fixed;left:0;top:0;width:100%;height:100%;
overflow:auto;background-color:rgb(0,0,0);background-color:rgba(0,0,0,0.4)}

.modal-content{margin:auto;background-color:#fff;position:relative;padding:0;outline:0;width:400px}

.azuka-center{text-align:center!important}

.azuka-section,.w3-code{margin-top:16px!important;margin-bottom:16px!important}

.azuka-card-4{box-shadow:0 4px 10px 0 rgba(0,0,0,0.2),0 4px 20px 0 rgba(0,0,0,0.19)}

.azuka-animate-zoom {animation:animatezoom 0.6s}@keyframes animatezoom{from{transform:scale(0)} to{transform:scale(1)}}

.azuka-input{padding:8px;display:block;border:none;border-bottom:1px solid #ccc;width:100%}

.azuka-border-0{border:0!important}.azuka-border{border:1px solid #ccc!important}
.azuka-border-top{border-top:1px solid #ccc!important}.w3-border-bottom{border-bottom:1px solid #ccc!important}
.w3-border-left{border-left:1px solid #ccc!important}.w3-border-right{border-right:1px solid #ccc!important}

.azuka-margin{margin:16px!important}.azuka-margin-top{margin-top:16px!important}.azuka-margin-bottom{margin-bottom:16px!important}

.azuka-button{width:100%}} .azuka-block{display:block;width:100%}

.azuka-padding-small{padding:4px 8px!important}.azuka-padding{padding:8px 16px!important}.azuka-padding-large{padding:12px 24px!important}
.azuka-padding-16{padding-top:16px!important;padding-bottom:16px!important}.w3-padding-24{padding-top:24px!important;padding-bottom:24px!important}
.w3-padding-32{padding-top:32px!important;padding-bottom:32px!important}.w3-padding-48{padding-top:48px!important;padding-bottom:48px!important}

.azuka-check,.azuka-radio{width:24px;height:24px;position:relative;top:6px}

.w3-left-align{text-align:left!important}.azuka-right-align{text-align:right!important}
.w3-justify{text-align:justify!important}.w3-center{text-align:center!important}

.w3-display-topleft{position:absolute;left:0;top:0}.azuka-display-topright{position:absolute;right:0;top:0}
.w3-display-bottomleft{position:absolute;left:0;bottom:0}.w3-display-bottomright{position:absolute;right:0;bottom:0}

.w3-red,.azuka-hover-red:hover{color:#fff!important;background-color:#f44336!important}
.w3-button:hover{color:#000!important;background-color:#ccc!important}


.w3-btn,.azuka-button{border:none;display:inline-block;padding:8px 16px;vertical-align:middle;overflow:hidden;text-decoration:none;color:inherit;
background-color:inherit;text-align:center;cursor:pointer;white-space:nowrap}

</style>


<div class="nd-container">
  <h2> Modal Login Form</h2>
  
  <p>  This example creates a modal for login: </p>
  <button onclick="document.getElementById('id01').style.display='block'" class="nd-button nd-green nd-large">Login</button>

  <div id="id01" class= "modal">
    <div class="modal-content azuka-card-4 azuka-animate-zoom" style="max-width:600px">

      <div class="azuka-center"><br>
        <span onclick="document.getElementById('id01').style.display='none'" class="nd-button nd-xlarge azuka-hover-red azuka-display-topright" title="Close Modal">&times;</span>
        <img src="/AdvancedWebDesign/w3-images/img_avatar4.png" alt="Avatar" style="width:30%" class="nd-circle nd-margin-top">
      </div>

      <form class="azuka-container" action="/action_page.php">
        <div class="azuka-section">
          <label><b>Username</b></label>
          <input class="azuka-input azuka-border azuka-margin-bottom" type="text" placeholder="Enter Username" name="usrname" required>
		  
          <label><b>Password</b></label>
          <input class="azuka-input azuka-border" type="password" placeholder="Enter Password" name="psw" required>
		  
          <button class="azuka-button azuka-block nd-green azuka-section azuka-padding" type="submit">Login</button>
          <input class="azuka-check azuka-margin-top" type="checkbox" checked="checked"> Remember me
        </div>
      </form>

      <div class="azuka-container azuka-border-top azuka-padding-16 nd-light-grey">
        <button onclick="document.getElementById('id01').style.display='none'" type="button" class=" nd-button nd-red">Cancel</button>
        <span class="nd-right nd-padding nd-hide-small">Forgot <a href="#">password?</a></span>
      </div>

    </div>
  </div>
</div>
            
</body>
</html>
