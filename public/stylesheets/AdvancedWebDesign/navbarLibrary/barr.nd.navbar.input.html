<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Navigation Bar with Input and Buttons</h2>

  <p>Input and button inside navbar:</p>
  <div class="nd-bar nd-light-grey nd-border">
    <a href="#" class="nd-bar-item nd-button nd-mobile">Home</a>
    <a href="#" class=" nd-bar-item nd-button nd-mobile  ">Link 1</a>
    <a href="#" class=" nd-bar-item nd-button nd-mobile ">Link 2</a>
    <input type="text" class="nd-bar-item nd-input nd-white nd-mobile" placeholder="Search..">
    <button class="nd-bar-item nd-button nd-green nd-mobile">Go</button>
  </div>
  
  <p>Padded navbar:</p>
  <div class="nd-bar nd-light-grey nd-border nd-padding">
    <a href="#" class=" nd-bar-item nd-button nd-mobile ">Home</a>
    <a href="#" class=" nd-bar-item nd-button nd-mobile  ">Link 1</a>
    <a href="#" class=" nd-bar-item nd-button nd-mobile ">Link 2</a>
    <input type="text" class="nd-bar-item nd-input nd-white nd-mobile" placeholder="Search..">
    <button class="nd-bar-item nd-button nd-green nd-mobile">Go</button>
  </div>
</div>

</body>
</html>
