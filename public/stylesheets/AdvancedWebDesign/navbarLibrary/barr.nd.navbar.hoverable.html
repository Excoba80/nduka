<!DOCTYPE html>

<body>
<div class="nd-container">

<h2>Hoverable Links</h2>
<p>When you mouse a button, the background color will change to grey.</p>
<p>If you want a different hover color, use any of the <strong>w3-hover-color</strong> classes:</p>

<div class="nd-bar nd-border nd-light-grey">
  <a href="#" class="nd-bar-item nd-button">Default</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-green">Link 1</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-blue">Link 2</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-teal">Link 3</a>
</div>

</div>
</body>
</html>
