<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="    /AdvancedWebDesign/barr.nd.css  ">
<body>
<div class="nd-container">

<h2>Hoverable Links</h2>
<p>Play around with different hover effects:</p>

<div class="nd-bar">
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-black">Link 1</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-black">Link 2</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-black">Link 3</a>
</div>
<br>
<div class="nd-bar">
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-green">Link 1</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-green">Link 2</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-green">Link 3</a>
</div>
<br>
<div class="nd-bar">
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-blue nd-hover-text-blue">Link 1</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-blue nd-hover-text-blue">Link 2</a>
  <a href="#" class="nd-bar-item nd-button nd-hover-none nd-border-white nd-bottombar nd-hover-border-blue nd-hover-text-blue">Link 3</a>
</div>
<br>
<div class="nd-bar">
  <a href="#" style="border:5px solid white" class="nd-bar-item nd-button nd-hover-none nd-hover-border-green">Link 1</a>
  <a href="#" style="border:5px solid white" class="nd-bar-item nd-button nd-hover-none nd-hover-border-red">Link 2</a>
  <a href="#" style="border:5px solid white" class="nd-bar-item nd-button nd-hover-none nd-hover-border-blue">Link 3</a>
</div>

</div>
</body>
</html>
