<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Navigation Bar with Dropdown</h2>
  <p>In this example, we remove the w3-bar-block class from w3-dropdown-content, to horizontally align the dropdown links (instead of vertically).</p>

  <div class="nd-bar nd-light-grey">
    <a href="#" class="nd-bar-item nd-button">Home</a>
    <a href="#" class="nd-bar-item nd-button">Link 1</a>
    <div class="nd-dropdown-hover">
      <button class="nd-button">Dropdown</button>
      <div class="nd-dropdown-content nd-card-4">
        <a href="#" class="nd-bar-item nd-button">Link 1</a>
        <a href="#" class="nd-bar-item nd-button">Link 2</a>
        <a href="#" class="nd-bar-item nd-button">Link 3</a>
      </div>
    </div>
  </div>
</div>
