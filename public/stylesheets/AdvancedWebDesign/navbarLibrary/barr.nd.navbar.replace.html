<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-bar nd-red">
  <a href="#" class="nd-bar-item nd-button">Home</a>
  <a href="#" class="nd-bar-item nd-button nd-hide-small">Link 1</a>
  <a href="#" class="nd-bar-item nd-button nd-hide-small">Link 2</a>
  <a href="#" class=" nd-bar-item nd-button nd-hide-small  ">Link 3</a>
  <a href="javascript:void(0)" class="nd-bar-item nd-button nd-right nd-hide-large nd-hide-medium" onclick="myFunction()">&#9776;</a>
</div>

<div id="demo" class="nd-bar-block nd-red nd-hide nd-hide-large nd-hide-medium">
  <a href="#" class="nd-bar-item nd-button">Link 1</a>
  <a href="#" class=" nd-bar-item nd-button   ">Link 2</a>
  <a href="#" class=" nd-bar-item nd-button    ">Link 3</a>
</div>

<div class="nd-container">
  <p>In the example, the navigation bar is replaced with a button (☰) in the top right corner when shown on tablets and mobile devices. When the button is clicked, the links in the bar will vertically stack.</p>
  <p>Resize the screen to see the effect.</p>
</div>

<script>
function myFunction() {
  var x = document.getElementById("demo");
  if (x.className.indexOf("nd-show") == -1) {
    x.className += " nd-show";
  } else { 
    x.className = x.className.replace(" nd-show", "");
  }
}
</script>

</body>
</html>
