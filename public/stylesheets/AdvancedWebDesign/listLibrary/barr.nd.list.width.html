<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css    ">
<body class="nd-container">

<h2>W3.CSS Lists</h2>
<p>Lists have a 100% width by default. Use the width property to change this:</p>

<p>Default:</p>
<ul class="nd-ul nd-border">
  <li>Jill</li>
  <li>Adam</li>
</ul>

<p>30% width:</p>
<ul class="nd-ul nd-border" style="width:30%">
  <li>Jill</li>
  <li>Adam</li>
</ul>

<p>50% width:</p>
<ul class="nd-ul nd-border" style="width:50%">
  <li>Jill</li>
  <li>Adam</li>
</ul>

<p>80% width:</p>
<ul class="nd-ul nd-border" style="width:80%">
  <li>Jill</li>
  <li>Adam</li>
</ul>

</body>
</html>
