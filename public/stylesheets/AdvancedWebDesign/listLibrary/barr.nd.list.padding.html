<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-container">
  <h2>Padded List</h2>
  <p>Use any of the w3-padding classes to increase or decrease the padding of each list item:</p>

  <p>Padding Small:
  <ul class="nd-ul nd-border" style="width:50%">
    <li class="nd-padding-small">Jill</li>
    <li class="nd-padding-small">Eve</li>
    <li class="nd-padding-small">Adam</li>
  </ul>

  <p>Default:</p>
  <ul class="nd-ul nd-border" style="width:50%">
    <li>Jill</li>
    <li>Eve</li>
    <li>Adam</li>
  </ul>

  <p>Padding Large:</p>
  <ul class="nd-ul nd-border" style="width:50%">
    <li class="nd-padding-large">Jill</li>
    <li class="nd-padding-large">Eve</li>
    <li class="nd-padding-large">Adam</li>
  </ul> 
</div>

</body>
</html>
