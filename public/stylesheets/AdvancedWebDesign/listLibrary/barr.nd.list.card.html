<div class="nd-container">
  <h2>List as a Card</h2>
  <p>The w3-card class makes the list look like a card:</p>
  <ul class="nd-ul nd-card" style="width:50%">
    <li>Jill</li>
    <li>Eve</li>
    <li>Adam</li>
  </ul>
  <br>

  <p>More shadows:</p>
  <ul class="nd-ul nd-card-4" style="width:50%">
    <li>Jill</li>
    <li>Eve</li>
    <li>Adam</li>
  </ul>
</div>
