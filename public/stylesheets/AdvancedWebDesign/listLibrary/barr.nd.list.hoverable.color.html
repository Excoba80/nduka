<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-container">
  <h2>Hoverable List</h2>
  <p>If you want a specific hover color, add any of the w3-hover-classes to each li element:</p>
  <ul class="nd-ul">
    <li class="nd-hover-red">Jill</li>
    <li class="nd-hover-green">Eve</li>
    <li class="nd-hover-blue">Adam</li>
    <li class="nd-hover-black">Bo</li>
    <li class="nd-hover-orange">Anja</li>
  </ul>
</div>

</body>
</html>
