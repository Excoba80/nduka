<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css ">
<body>

<div class="nd-container">
  <h2>Closable List Items</h2>
  
  <h3>Tip: The HTML &times; entity is the preferred icon for close buttons (rather than the letter "X"). </h3>
  
  <p>To close/hide the list items, click on the "x":</p>
  <ul class="nd-ul nd-card-4">
    <li class="nd-display-container">Jill <span onclick="this.parentElement.style.display='none'" class="nd-button nd-transparent nd-display-right">&times;</span></li>
    <li class="nd-display-container">Adam <span onclick="this.parentElement.style.display='none'" class="nd-button nd-transparent nd-display-right">&times;</span></li>
    <li class="nd-display-container">Eve <span onclick="this.parentElement.style.display='none'" class="nd-button nd-transparent nd-display-right">&times;</span></li>
  </ul>
</div>

</body>
</html>
