<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>Avatar List</h2>
  <p>You can combine w3-ul and the w3-bar classes to create an avatar list:</p>
  <ul class="nd-ul nd-card-4">
    <li class="nd-bar">
      <span onclick="this.parentElement.style.display='none'" class="nd-bar-item nd-button nd-white nd-xlarge nd-right">×</span>
      <img src="/AdvancedWebDesign/w3-images/img_avatar2.png" class="nd-bar-item nd-circle nd-hide-small" style="width:85px">
      <div class="nd-bar-item">   
        <span class="nd-large">Mike</span><br>
        <span>Web Designer</span>
      </div>
    </li>

    <li class="nd-bar">
      <span onclick="this.parentElement.style.display='none'" class="nd-bar-item nd-button nd-white nd-xlarge nd-right">×</span>
      <img src="/AdvancedWebDesign/w3-images/img_avatar5.png" class="nd-bar-item nd-circle nd-hide-small" style="width:85px">
      <div class="nd-bar-item">
        <span class="nd-large">Jill</span><br>
        <span>Support</span>
      </div>
    </li>

    <li class="nd-bar">
      <span onclick="this.parentElement.style.display='none'" class="nd-bar-item nd-button nd-white nd-xlarge nd-right">×</span>
      <img src="/AdvancedWebDesign/w3-images/img_avatar6.png " class="nd-bar-item nd-circle nd-hide-small" style="width:85px">
      <div class="nd-bar-item">
        <span class="nd-large">Jane</span><br>
        <span>Accountant</span>
      </div>
    </li>
  </ul>
</div>

</body>
</html>
