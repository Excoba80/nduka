<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css   ">
<body>
<div class="nd-container">

<h2>Badges in Buttons</h2>

<p>The w3-badge class can be used inside other elements like buttons:</p>

<p><button class="nd-btn nd-black">Button
<span class="nd-badge nd-margin-left nd-white">1</span>
</button></p>

<p><button class="nd-btn nd-red">Button
<span class="nd-badge nd-margin-left">2</span>
</button></p>

</div>
</body>
</html>
