<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="  /AdvancedWebDesign/barr.nd.css  ">
<body>

<div class="nd-container">
  <h2>List with Badges</h2>
  <p>The w3-right class floats an element to the right</p>
  <p>This is perfect for lists with badges:</p>

  <ul class="nd-ul nd-border">
    <li>Jill <span class="nd-badge nd-right nd-margin-right">5</span></li>
    <li>Eve <span class="nd-badge nd-right nd-margin-right">3</span></li>
    <li>Adam <span class="nd-badge nd-right nd-margin-right">8</span></li>
  </ul>
</div>

</body>
</html>
