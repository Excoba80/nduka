  <h2>W3.CSS Badges</h2>
  <h3>Since HTML5 supports the UTF-8 character set, you can use Dingbats for single digit badges.</h3>
  <p>You can display single digit badges using UTF-8 Dingbats:</p>

  <div class="nd-xxlarge">
  &#x2776; &#x2777; &#x2778; &#x2779; &#x277A;
  &#x2785; &#x2786; &#x2787; &#x2788; &#x2789;
  </div>

  <div class="nd-xxlarge nd-text-red">
  &#x2776; &#x2777; &#x2778; &#x2779; &#x277A;
  &#x2785; &#x2786; &#x2787; &#x2788; &#x2789;
  </div>

</div>
