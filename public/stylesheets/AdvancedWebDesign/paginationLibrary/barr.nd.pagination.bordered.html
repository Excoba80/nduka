<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css  ">
<body>
<div class="nd-container">

<h2>Bordered Pagination</h2>
<p>Add a w3-border class to add borders to a pagination:</p>

<div class="nd-bar nd-border">
  <a href="#" class="nd-bar-item nd-button">&laquo;</a>
  <a href="#" class="nd-bar-item nd-button  ">1</a>
  <a href="#" class=" nd-bar-item nd-button ">2</a>
  <a href="#" class=" nd-bar-item nd-button  ">3</a>
  <a href="#" class=" nd-bar-item nd-button  ">4</a>
  <a href="#" class=" nd-bar-item nd-button  ">&raquo;</a>
</div>

<p>Add a w3-show-inline-block class to display inline:</p>
<div class="nd-show-inline-block">
<div class="nd-bar nd-border">
  <a href="#" class="nd-bar-item nd-button ">&laquo;</a>
  <a href="#" class=" nd-bar-item nd-button ">1</a>
  <a href="#" class="nd-bar-item nd-button  ">2</a>
  <a href="#" class=" nd-bar-item nd-button ">3</a>
  <a href="#" class=" nd-bar-item nd-button  ">4</a>
  <a href="#" class="nd-bar-item nd-button   ">&raquo;</a>
</div>
</div>

<p>Add a w3-center class to center the pagination:</p>
<div class="nd-center">
<div class="nd-bar nd-border">
  <a href="#" class="nd-bar-item nd-button ">&laquo;</a>
  <a href="#" class=" nd-bar-item nd-button  ">1</a>
  <a href="#" class=" nd-bar-item nd-button ">2</a>
  <a href="#" class=" nd-bar-item nd-button ">3</a>
  <a href="#" class="nd-bar-item nd-button  ">4</a>
  <a href="#" class=" nd-bar-item nd-button ">&raquo;</a>
</div>
</div>

</div>
</body>
</html>
