<h2>Centered Pagination</h2>
<p>To center the pagination, put the "w3-bar" element inside a "w3-center" element:</p>

<div class="nd-center">
<div class="nd-bar">
  <a href="#" class="nd-button">&laquo;</a>
  <a href="#" class=" nd-button  ">1</a>
  <a href="#" class="nd-button    ">2</a>
  <a href="#" class=" nd-button   ">3</a>
  <a href="#" class=" nd-button   ">4</a>
  <a href="#" class="nd-button   ">&raquo;</a>
</div>
</div>

</div>
</body>
