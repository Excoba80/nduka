<!DOCTYPE html>

<body>
<div class="nd-container">

<h2>Pagination</h2>
<p>The w3-bar class can also be used to create next/previous buttons:</p>

<div class="nd-bar nd-border nd-round">
  <a href="#" class="nd-button">&#10094; Previous</a>
  <a href="#" class="nd-button nd-right">Next &#10095;</a>
</div>
<br>  
<div class="nd-bar nd-border">
  <a href="#" class="nd-button nd-border-right">&#10094;</a>
  <a href="#" class="nd-button nd-border-left nd-right">&#10095;</a>
</div>

</div>
</body>
</html>
