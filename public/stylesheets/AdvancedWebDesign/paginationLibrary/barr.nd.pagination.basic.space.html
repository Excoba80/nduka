<body>
<div class="nd-container">

<h2>Pagination</h2>

<p>  To remove the space between the buttons add a w3-bar-item class:    </p>

<div class="nd-bar">

  <a href="#" class=" nd-button   ">2</a>
  <a href="#" class=" nd-button ">3</a>
  <a href="#" class=" nd-button   ">4</a>
  <a href="#" class="  nd-button  ">5</a>
</div>

<div class="nd-bar">
  <a href="#" class="nd-bar-item nd-button">1</a>
  <a href="#" class="  nd-bar-item nd-button  ">2</a>
  <a href="#" class=" nd-bar-item nd-button   ">3</a>
  <a href="#" class=" nd-bar-item nd-button   ">4</a>
  <a href="#" class=" nd-bar-item nd-button   ">5</a>
</div>

</div>

</html>
