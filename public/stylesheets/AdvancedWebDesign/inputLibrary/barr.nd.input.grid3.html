<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css    ">
<body>

<div class="nd-container">
  <h2>Form Elements in a Grid</h2>
  <p>In this example, we use W3.CSS' Responsive Grid System to make the inputs appear on the same line (on smaller screens, they will stack horizontally with 100% width). You will learn more about this later.</p>
</div>

<div class="nd-row-padding">
  <div class="nd-third">
    <input class="nd-input nd-border" type="text" placeholder="One">
  </div>
  <div class="nd-third">
    <input class="nd-input nd-border" type="text" placeholder="Two">
  </div>
  <div class="nd-third">
    <input class="nd-input nd-border" type="text" placeholder="Three">
  </div>
</div>

</body>
</html>
