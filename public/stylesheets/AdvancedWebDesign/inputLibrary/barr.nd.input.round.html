<!DOCTYPE html>
<html>

<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css    ">
<body>

<form class="nd-container nd-card-4 nd-light-grey">
  <h2>Rounded Input</h2>
  <p>Use any of the w3-round classes to create rounded borders.</p>

  <p>
  <label>First Name</label>
  <input class="nd-input nd-border nd-round" name="first" type="text"></p>
  <p>
  <label>Last Name</label>
  <input class="nd-input nd-border nd-round-large" name="last" type="text"></p>
  <p>
  <label>Last Name</label>
  <input class="nd-input nd-border nd-round-xxlarge" name="last" type="text"></p>
</form>

</body>
</html>
