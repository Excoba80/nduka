<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="   /AdvancedWebDesign/barr.nd.css  ">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<body>

<form action="/action_page.php" class="nd-container nd-card-4 nd-light-grey nd-text-blue nd-margin">
<h2 class="nd-center">Contact Us</h2>
 
<div class="nd-row nd-section">
  <div class="nd-col" style="width:50px"><i class="w3-xxlarge fa fa-user"></i></div>
    <div class="nd-rest">
      <input class="nd-input nd-border" name="first" type="text" placeholder="First Name">
    </div>
</div>

<div class="nd-row nd-section">
  <div class="nd-col" style="width:50px"><i class="w3-xxlarge fa fa-user"></i></div>
    <div class="nd-rest">
      <input class="nd-input nd-border" name="last" type="text" placeholder="Last Name">
    </div>
</div>

<div class="nd-row nd-section">
  <div class="nd-col" style="width:50px"><i class="w3-xxlarge fa fa-envelope-o"></i></div>
    <div class="nd-rest">
      <input class="nd-input nd-border" name="email" type="text" placeholder="Email">
    </div>
</div>

<div class="nd-row nd-section">
  <div class="nd-col" style="width:50px"><i class="w3-xxlarge fa fa-phone"></i></div>
    <div class="nd-rest">
      <input class="nd-input nd-border" name="phone" type="text" placeholder="Phone">
    </div>
</div>

<div class="nd-row nd-section">
  <div class="nd-col" style="width:50px"><i class="w3-xxlarge fa fa-pencil"></i></div>
    <div class="nd-rest">
      <input class="nd-input nd-border" name="message" type="text" placeholder="Message">
    </div>
</div>

<button class="nd-button nd-block nd-section nd-blue nd-ripple nd-padding">Send</button>

</form>

</body>
</html>
