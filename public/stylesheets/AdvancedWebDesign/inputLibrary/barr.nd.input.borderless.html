<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href=" /AdvancedWebDesign/barr.nd.css   ">
<body>

<div class="nd-container">
  <h2>Borderless Input</h2>
  <p>The w3-input class has a bottom border by default. If you want a borderless input, add the w3-border-0 class.</p>
</div>

<form class="nd-container nd-card-4 nd-light-grey">
  <h3>Default:</h3>
  <p>      
  <label>First Name</label>
  <input class="nd-input" type="text"></p>
</form>
<br>

<form class="nd-container nd-card-4 nd-light-grey">
  <h3>Bordered:</h3>
  <p>      
  <label>First Name</label>
  <input class="nd-input nd-border" type="text"></p>
</form>
<br>

<form class="nd-container nd-card-4 nd-light-grey">
  <h3>Borderless:</h3>
  <p>      
  <label>First Name</label>
  <input class="nd-input nd-border-0" type="text"></p>
</form>

</body>
</html>
